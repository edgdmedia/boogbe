name: CI
on:
  pull_request: { branches: [dev, main] }
  push: { branches: [dev, main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://boogbe_app:app@localhost:5433/boogbe_test
      TEST_DATABASE_MIGRATE_URL: postgresql://boogbe_migrator:migrator@localhost:5433/boogbe_test
      DATABASE_URL: postgresql://boogbe_app:app@localhost:5433/boogbe_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1
      BETTER_AUTH_URL: http://localhost:5173
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 -f deploy/sql/roles.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 -f deploy/sql/db-init.sql
      - run: pnpm --filter @boogbe/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
