name: Deploy API
# Auto-deploy is disabled until the owner completes VPS setup (docs/RUNBOOK.md → Deploys).
# Re-enable by restoring: workflow_run: { workflows: [CI], types: [completed], branches: [dev, main] }
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = main ]; then cd /home/boogbe/app && bash deploy/deploy.sh prod; else cd /home/boogbe/staging && bash deploy/deploy.sh staging; fi
