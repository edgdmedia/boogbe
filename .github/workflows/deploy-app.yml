name: Deploy App
# Auto-deploy is disabled until the owner completes VPS setup (docs/RUNBOOK.md → Deploys).
# Re-enable by restoring: workflow_run: { workflows: [CI], types: [completed], branches: [dev, main] }
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@boogbe/app..." build
        env:
          VITE_API_ORIGIN: ${{ github.ref_name == 'main' && 'https://api.boogbe.com' || 'https://staging-api.boogbe.com' }}
      - run: npx wrangler@3 pages deploy apps/app/dist --project-name boogbe-app --branch ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
