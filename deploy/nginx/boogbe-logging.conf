# /etc/nginx/conf.d/boogbe-logging.conf (http level)
#
# iCal export links carry their secret in the path: /v1/ical/<token>.ics. Anyone with an access log
# would hold every channel's calendar link, so the token is replaced by *** before the line is written
# (T-M4-08 Step 3b, D-025). Everything else is logged as nginx's usual "combined" format.
map $request_uri $boogbe_masked_uri {
  "~^(?<boogbe_p>/v1/ical/)[^/?]+\.ics(?<boogbe_q>.*)$" "${boogbe_p}***.ics${boogbe_q}";
  default $request_uri;
}

log_format boogbe_masked '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $boogbe_masked_uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" rt=$request_time';
