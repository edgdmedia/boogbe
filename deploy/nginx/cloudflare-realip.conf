# /etc/nginx/conf.d/cloudflare-realip.conf
#
# Behind Cloudflare, every request reaches nginx from a Cloudflare address.
# This makes nginx use the visitor's real address instead ($remote_addr), read
# from the CF-Connecting-IP header — but only when the request really came from
# Cloudflare. A request from anywhere else keeps its own address, so the header
# cannot be forged by going around Cloudflare.
#
# Without it the API's rate limiter sees a handful of Cloudflare addresses and
# treats thousands of users as one, locking everyone out of login at once.
#
# http-level: files in conf.d/ are included inside the http {} block, so this
# applies to every server. Harmless for sites not behind Cloudflare, since
# their traffic never comes from these ranges.
#
# Cloudflare's ranges change rarely. Refresh with update-cloudflare-ips.sh,
# or compare by hand against https://www.cloudflare.com/ips/

real_ip_header CF-Connecting-IP;

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
