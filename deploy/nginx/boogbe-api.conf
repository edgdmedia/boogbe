# api.boogbe.com → PM2 on localhost. Only Cloudflare may reach the origin.
# Real client IPs come from /etc/nginx/conf.d/cloudflare-realip.conf (http level), so $remote_addr is the visitor.
# Access logs use boogbe_masked from /etc/nginx/conf.d/boogbe-logging.conf: iCal tokens never reach disk.
# Production only for launch; staging (staging-api.boogbe.com → 3061) comes back with its own server block.
server {
  listen 443 ssl http2;
  server_name api.boogbe.com;
  ssl_certificate     /etc/ssl/cloudflare/boogbe-origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/boogbe-origin.key;
  client_max_body_size 12m;
  access_log /var/log/nginx/boogbe-api.access.log boogbe_masked;
  # crit, not warn: upstream errors (e.g. a 502 during a PM2 reload) log the full request line, iCal token included.
  error_log  /var/log/nginx/boogbe-api.error.log crit;
  location / {
    proxy_pass http://127.0.0.1:3060;
    proxy_set_header Host $host;
    # A single X-Forwarded-For value: the API's auth rate limiter only trusts a one-entry header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
